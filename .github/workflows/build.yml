name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o PresetOne-Android-MVP.zip

      - name: Fix project
        run: |
          sed -i "/org.jetbrains.kotlin.android/d" PresetOne/app/build.gradle.kts
          sed -i 's/LocalContext.current/android.content.Context/' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt

      - name: Build APK
        run: cd PresetOne && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PresetOne-APK
          path: PresetOne/app/build/outputs/apk/debug/*.apk
