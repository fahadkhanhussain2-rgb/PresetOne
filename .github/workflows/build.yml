name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o PresetOne-Android-MVP.zip

      - name: Fix Kotlin plugin
        run: sed -i "/org.jetbrains.kotlin.android/d" PresetOne/app/build.gradle.kts

      - name: Build APK
        run: cd PresetOne && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PresetOne-APK
          path: PresetOne/app/build/outputs/apk/debug/*.apk
