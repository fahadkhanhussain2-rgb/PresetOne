name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o PresetOne-Android-MVP.zip

      - name: Fix Kotlin and source code
        run: |
          sed -i "/org.jetbrains.kotlin.android/d" PresetOne/app/build.gradle.kts
          sed -i '/import androidx.activity.ComponentActivity/a import androidx.activity.compose.setContent\nimport androidx.compose.ui.platform.LocalContext' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt
          sed -i 's/exportBitmap(this, original!!, edit)/exportBitmap(LocalContext.current, original!!, edit)/' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt
          sed -i 's/private fun exportBitmap(activity: ComponentActivity/private fun exportBitmap(activity: android.content.Context/' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt
          sed -i 's/Color.red(c)/android.graphics.Color.red(c)/g' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt
          sed -i 's/Color.green(c)/android.graphics.Color.green(c)/g' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt
          sed -i 's/Color.blue(c)/android.graphics.Color.blue(c)/g' PresetOne/app/src/main/java/com/presetone/app/MainActivity.kt

      - name: Build APK
        run: cd PresetOne && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PresetOne-APK
          path: PresetOne/app/build/outputs/apk/debug/*.apk
